name: One-time level navigation repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-level-navigation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair breadcrumbs and Level 4 progression
        run: python scripts/fix_level_navigation.py

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix level breadcrumbs and Level 4 progression"
          git push
