name: Apply GA4 tag to site pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ga4-tag.yml"

permissions:
  contents: write

jobs:
  apply-ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Google Analytics tag after head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          measurement_id = "G-F882YDG226"
          snippet = """<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-F882YDG226"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-F882YDG226');
          </script>"""

          changed = []
          skipped_empty = []
          no_head = []

          pages = sorted(
              p for p in Path(".").rglob("*")
              if p.is_file() and p.suffix.lower() in {".html", ".htm"}
          )

          for path in pages:
              text = path.read_text(encoding="utf-8")
              if measurement_id in text:
                  continue
              if not text.strip():
                  skipped_empty.append(str(path))
                  continue
              match = re.search(r"<head\b[^>]*>", text, flags=re.I)
              if not match:
                  no_head.append(str(path))
                  continue
              updated = text[:match.end()] + "\n" + snippet + text[match.end():]
              path.write_text(updated, encoding="utf-8")
              changed.append(str(path))

          print(f"Tagged {len(changed)} pages")
          print(f"Empty pages skipped: {skipped_empty}")
          print(f"Non-empty pages without head: {no_head}")

          untagged = []
          for path in pages:
              text = path.read_text(encoding="utf-8")
              if text.strip() and re.search(r"<head\b[^>]*>", text, flags=re.I) and measurement_id not in text:
                  untagged.append(str(path))

          if untagged:
              raise SystemExit("Untagged pages remain: " + ", ".join(untagged))
          PY

      - name: Commit GA4 tags
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No GA4 changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.htm'
          git commit -m "Add GA4 tracking to all site pages"
          git push
