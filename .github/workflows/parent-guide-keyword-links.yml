name: Parent Guide Keyword Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/parent-guide-keyword-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-parent-articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add keyword-informed internal links
        run: |
          python - <<'PY'
          from pathlib import Path

          related = {
            'how-children-learn-to-read.html': 'A useful next step is learning how <a href="what-are-letter-sounds.html">letter sounds</a> connect print to speech, then using <a href="what-are-decodable-stories.html">decodable stories</a> for real reading practice. Parents who want a simple routine can also learn how to practice <a href="how-to-teach-phonics-at-home.html">phonics at home</a>.',
            'what-are-letter-sounds.html': 'Once the first sounds feel familiar, see how they fit into the larger process of <a href="how-children-learn-to-read.html">learning to read</a>. You can then practice them through <a href="what-are-decodable-stories.html">decodable stories</a> or follow the simple guide to <a href="how-to-teach-phonics-at-home.html">phonics at home</a>.',
            'what-are-sight-words.html': 'Sight-word practice works best beside strong <a href="what-are-letter-sounds.html">letter sounds</a> and short <a href="what-are-decodable-stories.html">decodable stories</a>. When a child starts <a href="what-to-do-when-your-child-guesses-words.html">guessing words</a>, calmly return attention to the letters on the page.',
            'what-are-decodable-stories.html': 'Good decodable text combines familiar <a href="what-are-letter-sounds.html">letter sounds</a> with only a few necessary <a href="what-are-sight-words.html">sight words</a>. It also helps prevent the habit of <a href="what-to-do-when-your-child-guesses-words.html">guessing words</a> from pictures or context.',
            'what-to-do-when-your-child-guesses-words.html': 'Word guessing usually improves when practice returns to clear <a href="what-are-letter-sounds.html">letter sounds</a> and carefully matched <a href="what-are-decodable-stories.html">decodable stories</a>. These <a href="how-to-help-without-giving-the-answer.html">calm reading prompts</a> can help without turning the moment into a test.',
            'how-long-should-reading-practice-take.html': 'Short, consistent <a href="how-to-teach-phonics-at-home.html">phonics at home</a> is usually easier to sustain than occasional long sessions. The same gentle rhythm is built into the <a href="how-to-use-beach-cat-lessons.html">Beach Cat lessons</a>, with guidance for when to seek <a href="when-to-ask-a-teacher-for-help.html">teacher help</a>.',
            'how-to-help-without-giving-the-answer.html': 'The best prompts direct a child back to <a href="what-are-letter-sounds.html">letter sounds</a> instead of supplying the word. They are especially useful when a child is <a href="what-to-do-when-your-child-guesses-words.html">guessing words</a> or when you are deciding whether to ask for <a href="when-to-ask-a-teacher-for-help.html">teacher help</a>.',
            'when-to-ask-a-teacher-for-help.html': 'Before the conversation, note what happens during short <a href="how-long-should-reading-practice-take.html">reading practice</a>: whether your child remembers <a href="what-are-letter-sounds.html">letter sounds</a>, blends them, or keeps <a href="what-to-do-when-your-child-guesses-words.html">guessing words</a>. Specific examples help the teacher understand the pattern.',
            'how-to-use-beach-cat-lessons.html': 'The lessons are designed as simple <a href="how-to-teach-phonics-at-home.html">phonics at home</a>: one sound, a few words, and a short <a href="what-are-decodable-stories.html">decodable story</a>. Use the <a href="reading-path.html">Reading Path</a> to choose the right starting level.'
          }

          marker = '<div class="article-next">'
          comment = '<!-- keyword-related-reading -->'

          for filename, paragraph in related.items():
            path = Path(filename)
            if not path.exists():
              raise SystemExit(f'Missing expected article: {filename}')
            html = path.read_text(encoding='utf-8')
            if comment in html:
              continue
            if marker not in html:
              raise SystemExit(f'Missing article-next marker in {filename}')
            block = f'{comment}\n<div class="article-callout seo-related"><strong>Related reading:</strong> {paragraph}</div>\n'
            path.write_text(html.replace(marker, block + marker, 1), encoding='utf-8')

          guide = Path('parent-guide.html')
          guide_html = guide.read_text(encoding='utf-8')
          if 'guide-how-to-teach-phonics-at-home' not in guide_html:
            card = '\n<a class="article-card" href="how-to-teach-phonics-at-home.html" id="guide-how-to-teach-phonics-at-home"><div class="article-icon">🏠</div><h3>How to Teach Phonics at Home</h3><p>A simple ten-minute routine using letter sounds, blending, short words, and tiny stories.</p><span class="read-link">Read guide →</span></a>\n'
            target = '<a class="article-card" href="what-are-letter-sounds.html"'
            if target not in guide_html:
              raise SystemExit('Could not find Parent Guide insertion point')
            guide.write_text(guide_html.replace(target, card + target, 1), encoding='utf-8')

          css = Path('styles.css')
          css_text = css.read_text(encoding='utf-8')
          css_marker = '/* Contextual article links */'
          if css_marker not in css_text:
            css_text += '\n\n/* Contextual article links */\n.article-card-full p a, .seo-related a { color: var(--color-orange); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 600; }\n'
            css.write_text(css_text, encoding='utf-8')
          PY

      - name: Commit SEO article links
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parent-guide.html styles.css *.html
          git commit -m "Add keyword-informed parent article links"
          git push
